name: Build and Push

on:
  push:
    branches: [ '**' ]
  delete:

permissions:
  contents: write
  packages: write

jobs:
  build:
    if: github.event_name == 'push'
    uses: team-redbull/.github/.github/workflows/ghcr-build-push.yml@main
    with:
      image-name: segments-manager
      # Chart lives in the redbull-platform repo now (Argo CD renders it from there).
      # The bump + the `segments-manager/vX.Y.Z` tag land there, on main only.
      chart-repo: team-redbull/redbull-platform
      helm-values-path: gitops/charts/segments-manager/values.yaml
    secrets: inherit

  cleanup-on-delete:
    if: github.event_name == 'delete'
    uses: team-redbull/.github/.github/workflows/ghcr-cleanup-on-delete.yml@main
    with:
      image-name: segments-manager
    secrets: inherit
